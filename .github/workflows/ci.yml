name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Testing and Linting
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Check Prettier formatting
      run: npm run format:check
    
    - name: Run type checking
      run: npm run type-check
    
    - name: Run unit tests
      run: npm run test:ci
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend

  # Backend Testing and Linting
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: services/requirements*.txt
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run Black formatting check
      run: black --check src/
    
    - name: Run isort import sorting check
      run: isort --check-only src/
    
    - name: Run flake8 linting
      run: flake8 src/
    
    - name: Run MyPy type checking
      run: mypy src/
    
    - name: Run pytest
      run: pytest --cov=src --cov-report=xml
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./services/coverage.xml
        flags: backend

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker Build and Test
  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: rag-platform-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build document processing service Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./services/document-processing
        file: ./services/document-processing/Dockerfile
        push: false
        tags: rag-platform-doc-processing:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build query processing service Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./services/query-processing
        file: ./services/query-processing/Dockerfile
        push: false
        tags: rag-platform-query-processing:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Start services with Docker Compose
      run: docker-compose -f docker-compose.test.yml up -d
    
    - name: Wait for services to be ready
      run: |
        timeout 300 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:8001/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:8002/health; do sleep 5; done'
    
    - name: Run integration tests
      run: |
        cd frontend
        npm run test:integration
    
    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.test.yml down

  # Deployment (only on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment steps here
        # This could involve:
        # - Building and pushing Docker images to registry
        # - Updating Kubernetes manifests
        # - Triggering ArgoCD sync
        # - Running smoke tests
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests against staging..."
        # Add smoke test commands here

  # Notify on completion
  notify:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test, security-scan]
    if: always()
    
    steps:
    - name: Notify on success
      if: ${{ needs.frontend-test.result == 'success' && needs.backend-test.result == 'success' && needs.security-scan.result == 'success' }}
      run: echo "✅ All checks passed!"
    
    - name: Notify on failure
      if: ${{ needs.frontend-test.result == 'failure' || needs.backend-test.result == 'failure' || needs.security-scan.result == 'failure' }}
      run: echo "❌ Some checks failed!"